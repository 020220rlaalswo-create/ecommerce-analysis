name: Olist 실데이터 분석 및 결과 검증

on:
  push:
    branches: [feature/olist-complete-portfolio]
    paths:
      - 'src/**'
      - 'requirements.txt'
      - '.github/workflows/olist-analysis.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 한글 글꼴 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
          fc-cache -f
      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt kagglehub
      - name: Olist 공개 데이터 다운로드
        run: |
          python - <<'PY'
          import kagglehub
          from pathlib import Path
          import shutil
          root = Path(kagglehub.dataset_download("olistbr/brazilian-ecommerce"))
          target = Path("data/raw")
          target.mkdir(parents=True, exist_ok=True)
          names = ["olist_orders_dataset.csv", "olist_customers_dataset.csv",
                   "olist_order_items_dataset.csv", "olist_order_payments_dataset.csv",
                   "olist_order_reviews_dataset.csv", "olist_products_dataset.csv",
                   "product_category_name_translation.csv"]
          for name in names:
              paths = list(root.rglob(name))
              if not paths: raise FileNotFoundError(name)
              shutil.copy2(paths[0], target / name)
          print("원본 파일 7개 확보 완료")
          PY
      - name: 분석 및 그래프 생성
        run: python src/analyze.py --data-dir data/raw --out-dir outputs
      - name: 기초 검증
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          o=Path("outputs")
          metrics=json.loads((o/"kpis.json").read_text())
          orders=pd.read_csv(o/"order_level.csv")
          months=pd.read_csv(o/"monthly_sales.csv")
          categories=pd.read_csv(o/"category_sales.csv")
          assert len(orders)==metrics["all_orders"]
          assert orders.order_id.is_unique
          assert 0 <= metrics["late_delivery_rate"] <= 1
          assert 0 <= metrics["observed_repeat_customer_rate"] <= 1
          assert abs(months.product_revenue.sum()-metrics["product_revenue_brl"]) < 1
          assert abs(categories.product_revenue.sum()-metrics["product_revenue_brl"]) < 1
          assert len(list(o.glob("*.png"))) == 7
          print("검증 통과", metrics)
          PY
      - name: 실제 결과 및 보고서 생성
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          m=json.loads(Path("outputs/kpis.json").read_text(encoding="utf-8"))
          d=Path("reports");d.mkdir(exist_ok=True)
          for p in Path("outputs").glob("*.png"): shutil.copy2(p,d/p.name)
          for name in ("kpis.json","monthly_sales.csv","category_sales.csv"):
              shutil.copy2(Path("outputs")/name,d/name)
          lines=["# Olist 실데이터 분석 결과", "",
                 "GitHub Actions에서 Kaggle 공개 Olist 데이터로 실행하고 자동 검증한 결과입니다.", "",
                 "## 확인된 지표", "",
                 "| 항목 | 측정값 |", "|---|---:|",
                 f'| 전체 주문 | {m["all_orders"]:,}건 |',
                 f'| 배송 완료 주문 | {m["delivered_orders"]:,}건 |',
                 f'| 배송 완료 주문의 고유 고객 | {m["unique_delivered_customers"]:,}명 |',
                 f'| 배송 완료 주문의 상품 매출 합계 | {m["product_revenue_brl"]:,.2f} BRL |',
                 f'| 결제 금액 합계 | {m["payment_total_brl"]:,.2f} BRL |',
                 f'| 평균 배송 소요일 | {m["mean_delivery_days"]:.2f}일 |',
                 f'| 배송 지연율 | {m["late_delivery_rate"]:.2%} (분모 {m["late_delivery_denominator"]:,}건) |',
                 f'| 관측 기간 재구매 고객 비율 | {m["observed_repeat_customer_rate"]:.2%} (분모 {m["repeat_customer_denominator"]:,}명) |',
                 "", "## 실제 데이터 시각화", ""]
          for fn,title in [("01_monthly_revenue.png","월별 상품 매출"),
                           ("02_category_revenue.png","상위 상품 카테고리"),
                           ("03_order_status.png","주문 처리 상태"),
                           ("04_delivery_days.png","배송 소요일"),
                           ("05_late_delivery_states.png","지역별 배송 지연율"),
                           ("06_repeat_customers.png","재구매 고객 분포"),
                           ("07_review_vs_lateness.png","배송 지연과 리뷰 점수")]:
              lines.extend([f"### {title}",f"![{title}]({fn})",""])
          lines.extend(["## 분석상 주의점","",
                        "- 상품 매출은 배송 완료 주문의 상품 가격 합계이며 순이익이나 재무상 확정 매출이 아닙니다.",
                        "- 재구매율은 관측 기간 내 재구매 비율로, 장기 유지율이 아닙니다.",
                        "- 배송 지연과 리뷰 평점의 관계는 인과성을 입증하지 않습니다.",""])
          (d/"README.md").write_text("\n".join(lines),encoding="utf-8")
          PY
      - name: 생성 결과를 작업 브랜치에 반영
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/
          if git diff --cached --quiet; then
            echo "새로운 결과 없음"
          else
            git commit -m "실제 Olist 분석 결과와 시각화 7종 게시"
            git push
          fi
